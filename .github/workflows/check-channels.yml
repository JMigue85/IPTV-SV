name: Verificar Canales

on:
  schedule:
    - cron: '0 6,18 * * *'   # 2 veces al día (6am y 6pm UTC)
  workflow_dispatch:          # botón "Run workflow" manual en la pestaña Actions

permissions:
  contents: write

jobs:
  check-channels:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Generar reporte
        working-directory: scripts
        run: |
          python generar_reporte.py ../IPTVSV.m3u ../PlutoTV.ES.m3u ../PlutoTV.MX.m3u --salida ../REPORTE.md

      - name: Commitear reporte actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add REPORTE.md
          git diff --staged --quiet || git commit -m "🔄 Actualiza reporte de canales [automático]"
          git push
